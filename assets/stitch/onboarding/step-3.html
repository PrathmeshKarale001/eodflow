<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EOD Flow - Ready to Ship</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#180065",
              "secondary-container": "#4330ab",
              "on-tertiary-fixed": "#2f1500",
              "primary-fixed-dim": "#c6bfff",
              "tertiary-container": "#ac5d00",
              "inverse-primary": "#5847d2",
              "on-surface": "#e5e2e1",
              "surface-container": "#201f1f",
              "surface": "#131313",
              "surface-container-highest": "#353534",
              "on-tertiary": "#4d2600",
              "on-primary": "#2900a0",
              "on-error-container": "#ffdad6",
              "tertiary": "#ffb77d",
              "surface-container-high": "#2a2a2a",
              "surface-variant": "#353534",
              "surface-bright": "#3a3939",
              "background": "#0A0A0A",
              "inverse-on-surface": "#313030",
              "on-secondary-fixed-variant": "#4330ab",
              "on-tertiary-container": "#fff5f1",
              "inverse-surface": "#e5e2e1",
              "on-background": "#e5e2e1",
              "on-surface-variant": "#c8c4d7",
              "on-primary-container": "#faf6ff",
              "surface-tint": "#c6bfff",
              "surface-dim": "#131313",
              "error-container": "#93000a",
              "tertiary-fixed": "#ffdcc3",
              "surface-container-lowest": "#0e0e0e",
              "outline": "#928ea0",
              "error": "#ffb4ab",
              "on-primary-fixed-variant": "#4029ba",
              "primary-container": "#6c5ce7",
              "secondary": "#c7bfff",
              "primary": "#c6bfff",
              "on-primary-fixed": "#160066",
              "on-secondary-container": "#b5abff",
              "on-secondary": "#2c0d95",
              "outline-variant": "#474554",
              "secondary-fixed-dim": "#c7bfff",
              "tertiary-fixed-dim": "#ffb77d",
              "surface-container-low": "#1c1b1b",
              "on-tertiary-fixed-variant": "#6e3900",
              "secondary-fixed": "#e5deff",
              "primary-fixed": "#e4dfff",
              "on-error": "#690005"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans", "sans-serif"],
              "body": ["Plus Jakarta Sans", "sans-serif"],
              "label": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0A0A0A;
            color: #e5e2e1;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }
        .canvas-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .spotlight {
            background: radial-gradient(circle at center, rgba(108, 92, 231, 0.08) 0%, rgba(10, 10, 10, 0) 70%);
        }
        .glossy-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(12px);
        }
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(2deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen canvas-grid">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#0A0A0A]/60 backdrop-blur-xl flex justify-between items-center px-12 py-8">
<div class="text-2xl font-bold tracking-tighter text-white font-headline">
            EOD<span class="text-primary-container">FLOW</span>
</div>
<button class="text-neutral-500 hover:text-white transition-colors duration-300 font-bold text-[10px] tracking-[0.3em] uppercase">
            Skip
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center relative px-6 pt-20">
<!-- Ambient Spotlight Effect -->
<div class="absolute inset-0 spotlight pointer-events-none"></div>
<!-- Success Visual -->
<div class="relative z-10 w-full max-w-4xl flex flex-col items-center">
<div class="relative mb-16">
<!-- Glowing Deliverable Component -->
<div class="w-72 h-96 rounded-[2rem] glossy-card border border-white/10 shadow-2xl flex flex-col p-8 floating transform rotate-2">
<div class="h-1.5 w-16 bg-white/20 rounded-full mb-8"></div>
<div class="space-y-4 mb-12">
<div class="h-1 w-full bg-white/10 rounded-full"></div>
<div class="h-1 w-5/6 bg-white/10 rounded-full"></div>
<div class="h-1 w-4/6 bg-white/10 rounded-full"></div>
</div>
<!-- The 'Glowing' Project Result -->
<div class="mt-auto bg-primary-container/10 rounded-2xl p-5 border border-primary-container/30 flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-white shadow-[0_0_30px_rgba(108,92,231,0.4)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<p class="text-[9px] font-bold text-primary-container uppercase tracking-[0.2em] mb-0.5">Status</p>
<p class="text-white font-bold text-sm">Delivered</p>
</div>
</div>
</div>
<!-- Decorative Layer -->
<div class="absolute -top-10 -left-14 w-72 h-96 rounded-[2rem] bg-white/[0.02] border border-white/5 -z-10 transform -rotate-6"></div>
<!-- Abstract Glow -->
<div class="absolute -bottom-20 -right-20 w-64 h-64 bg-primary-container/10 blur-[100px] rounded-full"></div>
</div>
<!-- Typography Header -->
<div class="text-center space-y-6 max-w-2xl">
<h1 class="font-headline font-extralight text-6xl md:text-8xl tracking-tight text-white leading-none">
                    Ready to Ship
                </h1>
<p class="font-body text-outline text-xl tracking-wide font-light max-w-lg mx-auto">
                    Your new workflow starts now. Engineered for extreme creative velocity.
                </p>
</div>
<!-- Progress Indicator -->
<div class="flex items-center gap-3 mt-16 mb-12">
<div class="h-1 w-1 rounded-full bg-white/20"></div>
<div class="h-1 w-1 rounded-full bg-white/20"></div>
<div class="h-1 w-12 rounded-full bg-primary-container shadow-[0_0_12px_rgba(108,92,231,0.5)]"></div>
</div>
<!-- Action Area -->
<div class="w-full max-w-xs">
<button class="w-full bg-primary-container text-white px-10 py-6 rounded-none border-b-4 border-r-4 border-white/10 hover:border-transparent transition-all transform hover:scale-[1.02] active:scale-95 font-headline font-bold uppercase tracking-[0.2em] flex justify-center items-center gap-3 text-sm">
                    Go to Dashboard
                    <span class="material-symbols-outlined text-xl">arrow_outward</span>
</button>
</div>
</div>
</main>
<!-- Footer Decorative -->
<footer class="w-full flex justify-center pb-12 opacity-30 pointer-events-none">
<div class="flex items-center gap-4">
<span class="w-12 h-px bg-white/20"></span>
<p class="uppercase text-[9px] tracking-[0.5em] font-bold text-white">Internal use only · end of day media</p>
<span class="w-12 h-px bg-white/20"></span>
</div>
</footer>
<!-- Background Decoration -->
<div class="fixed top-[10%] -left-40 w-[50rem] h-[50rem] bg-primary-container/5 blur-[150px] rounded-full pointer-events-none -z-20"></div>
<div class="fixed -bottom-40 -right-40 w-[40rem] h-[40rem] bg-secondary-container/5 blur-[150px] rounded-full pointer-events-none -z-20"></div>
<div class="hidden" data-location="San Francisco"></div>
</body></html>
