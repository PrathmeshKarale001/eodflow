<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-10 py-8 bg-[#131313]/80 backdrop-blur-md">
<div class="text-xl font-medium tracking-tighter text-white font-headline">
            EOD Flow

<button class="text-zinc-500 hover:text-white transition-colors duration-300 font-label text-sm uppercase tracking-widest">
            Skip
        </button>
</header>
<main class="relative h-screen w-full flex flex-col items-center justify-center obsidian-glow px-6">
<!-- Background Ambient Element -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] obsidian-glow pointer-events-none"></div>

<div class="absolute left-10 top-20 transform -rotate-12 opacity-40">
<div class="p-4 rounded-xl glass-card border border-outline-variant/20 shadow-2xl max-w-[200px]">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-green-400 text-sm">chat</span>
<div class="h-1.5 w-12 bg-zinc-700 rounded-full"></div>
</div>
<div class="h-1.5 w-full bg-zinc-800 rounded-full mb-2"></div>
<div class="h-1.5 w-3/4 bg-zinc-800 rounded-full"></div>
</div>
</div>
<div class="absolute right-10 top-32 transform rotate-6 opacity-30">

<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-blue-400 text-sm">mail</span>
<div class="h-1.5 w-16 bg-zinc-700 rounded-full"></div>
</div>
<div class="h-1.5 w-full bg-zinc-800 rounded-full"></div>
</div>
</div>
<div class="absolute left-24 bottom-24 transform -rotate-3 opacity-20">
<div class="p-3 rounded-lg bg-surface-container-lowest border border-outline-variant/10 shadow-xl">
<span class="material-symbols-outlined text-zinc-600">attach_file</span>
</div>
</div>
<!-- Centralized "Brief" Card -->
<div class="relative z-10 w-full max-w-md">
<!-- Visual Connectors (Abstract Lines) -->
<svg class="absolute inset-0 w-full h-full -z-10 overflow-visible" viewbox="0 0 400 300">
<path class="opacity-50" d="M 50 100 Q 150 150 200 150" fill="none" stroke="url(#purpleGradient)" stroke-dasharray="4 4" stroke-width="1.5"></path>
<path class="opacity-50" d="M 350 120 Q 250 150 200 150" fill="none" stroke="url(#purpleGradient)" stroke-dasharray="4 4" stroke-width="1.5"></path>
<defs>
<lineargradient id="purpleGradient" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" style="stop-color: #6c5ce7; stop-opacity: 0"></stop>
<stop offset="100%" style="stop-color: #c6bfff; stop-opacity: 1"></stop>
</lineargradient>
</defs>
</svg>
<div class="p-8 rounded-2xl bg-surface-container-high border border-primary/20 shadow-[0_0_50px_rgba(108,92,231,0.2)]">
<div class="flex items-center justify-between mb-8">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<div>
<h3 class="font-headline font-semibold text-white text-lg leading-tight">Project Aurora</h3>
<p class="text-zinc-500 text-xs font-label">Campaign Brief #402</p>
</div>
</div>
<span class="px-3 py-1 rounded-full bg-primary/10 text-primary text-[10px] font-bold uppercase tracking-wider">Active</span>
</div>
<div class="space-y-4">
<div class="flex items-center gap-4 p-3 rounded-lg bg-surface-container-lowest border border-outline-variant/10">

<div class="h-2 w-32 bg-zinc-800 rounded-full"></div>
</div>
<div class="flex items-center gap-4 p-3 rounded-lg bg-surface-container-lowest border border-outline-variant/10">
<span class="material-symbols-outlined text-zinc-400 text-sm">group</span>
<div class="h-2 w-24 bg-zinc-800 rounded-full"></div>
</div>
<div class="h-px w-full bg-outline-variant/10 my-2"></div>
<div class="flex items-center gap-4 p-3 rounded-lg bg-primary/5 border border-primary/10">
<span class="material-symbols-outlined text-primary text-sm">auto_awesome</span>
<div class="h-2 w-48 bg-primary/20 rounded-full"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Copy and Call to Action -->
<div class="text-center max-w-xl z-20">
<h1 class="font-headline text-5xl md:text-6xl font-thin tracking-tight text-white mb-6">
                Stop the chaos. <br/>
<span class="font-medium text-primary">Centralize your briefs.</span>
</h1>
<p class="font-body text-zinc-400 text-lg mb-12 max-w-sm mx-auto">
                No more chasing messages. Every detail is automatically curated into one editorial command center.
            </p>
</div>
<!-- Footer / Navigation -->
<div class="absolute bottom-12 w-full px-12 flex flex-col items-center gap-8">

<div class="flex gap-3 items-center">

<div class="w-1.5 h-1.5 rounded-full bg-zinc-700"></div>
<div class="w-1.5 h-1.5 rounded-full bg-zinc-700"></div>
</div>
<!-- Next Button -->
<button class="group flex items-center gap-3 bg-primary-container hover:bg-primary-fixed-dim px-8 py-4 rounded-xl transition-all duration-300 shadow-xl shadow-primary-container/20">
<span class="font-headline font-semibold text-white group-hover:text-on-secondary-fixed transition-colors">Next Step</span>
<span class="material-symbols-outlined text-white group-hover:text-on-secondary-fixed group-hover:translate-x-1 transition-all">arrow_forward</span>
</button>
</div>

<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-primary/5 blur-[120px] rounded-full pointer-events-none"></div>
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary-container/5 blur-[120px] rounded-full pointer-events-none"></div>
